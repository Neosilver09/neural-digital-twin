[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neural-digital-twin"
version = "0.1.0"
description = "State estimation under uncertainty (Kalman/particle filtering + ML) applied to a simulated aircraft and to hidden asset volatility."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Anishan Sebanathan" },
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/neural_digital_twin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
